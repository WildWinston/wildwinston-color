  <circle cx="240" cy="50" r="6" fill="none" stroke="#000" stroke-width="3"/>
  <!-- Head -->
  <circle cx="200" cy="145" r="50" fill="none" stroke="#000" stroke-width="7"/>
  <!-- Hair left -->
  <path d="M155 130 Q130 160 135 220 Q140 250 155 260" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <!-- Hair right -->
  <path d="M245 130 Q270 160 265 220 Q260 250 245 260" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
