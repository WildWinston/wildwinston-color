  <!-- Smile -->
  <path d="M180 165 Q200 180 220 165" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- Dress body -->
  <path d="M170 195 L155 210 L120 350 L280 350 L245 210 L230 195" fill="none" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <!-- Dress waist -->
  <ellipse cx="200" cy="215" rx="35" ry="12" fill="none" stroke="#000" stroke-width="5"/>
  <!-- Neck -->
  <line x1="190" y1="195" x2="190" y2="210" stroke="#000" stroke-width="5"/>
  <line x1="210" y1="195" x2="210" y2="210" stroke="#000" stroke-width="5"/>
  <!-- Arms -->
