<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Main building -->
  <rect x="100" y="180" width="200" height="160" fill="none" stroke="#000" stroke-width="7"/>
  <!-- Left tower -->
  <rect x="60" y="140" width="60" height="200" fill="none" stroke="#000" stroke-width="7"/>
  <!-- Right tower -->
  <rect x="280" y="140" width="60" height="200" fill="none" stroke="#000" stroke-width="7"/>
  <!-- Center tower -->
  <rect x="160" y="100" width="80" height="80" fill="none" stroke="#000" stroke-width="7"/>
  <!-- Roofs / pointed tops -->
  <path d="M50 140 L90 70 L130 140 Z" fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M270 140 L310 70 L350 140 Z" fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M150 100 L200 40 L250 100 Z" fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Flag on center -->
  <line x1="200" y1="40" x2="200" y2="20" stroke="#000" stroke-width="4"/>
  <path d="M200 20 L230 30 L200 40 Z" fill="none" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Door -->
  <path d="M170 280 L170 340 L230 340 L230 280 Q200 250 170 280 Z" fill="none" stroke="#000" stroke-width="6"/>
  <!-- Windows -->
  <rect x="75" y="180" width="30" height="35" rx="4" fill="none" stroke="#000" stroke-width="5"/>
  <rect x="295" y="180" width="30" height="35" rx="4" fill="none" stroke="#000" stroke-width="5"/>
  <rect x="130" y="210" width="35" height="40" rx="4" fill="none" stroke="#000" stroke-width="5"/>
  <rect x="235" y="210" width="35" height="40" rx="4" fill="none" stroke="#000" stroke-width="5"/>
  <circle cx="200" cy="140" r="18" fill="none" stroke="#000" stroke-width="5"/>
  <!-- Battlements on main -->
  <rect x="110" y="165" width="20" height="15" fill="none" stroke="#000" stroke-width="4"/>
  <rect x="150" y="165" width="20" height="15" fill="none" stroke="#000" stroke-width="4"/>
  <rect x="230" y="165" width="20" height="15" fill="none" stroke="#000" stroke-width="4"/>
  <rect x="270" y="165" width="20" height="15" fill="none" stroke="#000" stroke-width="4"/>
</svg>
