<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Dog head -->
  <ellipse cx="200" cy="210" rx="100" ry="95" fill="none" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <!-- Left floppy ear -->
  <ellipse cx="95" cy="200" rx="35" ry="70" fill="none" stroke="#000" stroke-width="7" transform="rotate(-15 95 200)"/>
  <!-- Right floppy ear -->
  <ellipse cx="305" cy="200" rx="35" ry="70" fill="none" stroke="#000" stroke-width="7" transform="rotate(15 305 200)"/>
  <!-- Left eye -->
  <circle cx="165" cy="190" r="18" fill="none" stroke="#000" stroke-width="6"/>
  <circle cx="165" cy="193" r="7" fill="#000"/>
  <!-- Right eye -->
  <circle cx="235" cy="190" r="18" fill="none" stroke="#000" stroke-width="6"/>
  <circle cx="235" cy="193" r="7" fill="#000"/>
  <!-- Snout -->
  <ellipse cx="200" cy="250" rx="45" ry="35" fill="none" stroke="#000" stroke-width="6"/>
  <!-- Nose -->
  <ellipse cx="200" cy="240" rx="18" ry="14" fill="none" stroke="#000" stroke-width="6"/>
  <circle cx="200" cy="240" r="6" fill="#000"/>
  <!-- Tongue -->
  <path d="M185 270 Q200 300 215 270" fill="none" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Spot on head -->
  <ellipse cx="155" cy="145" rx="25" ry="20" fill="none" stroke="#000" stroke-width="5"/>
</svg>
