<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Cat face -->
  <ellipse cx="200" cy="220" rx="110" ry="100" fill="none" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <!-- Left ear -->
  <path d="M100 150 L90 70 L160 130 Z" fill="none" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <!-- Right ear -->
  <path d="M300 150 L310 70 L240 130 Z" fill="none" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
  <!-- Inner left ear -->
  <path d="M110 145 L105 95 L145 130 Z" fill="none" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Inner right ear -->
  <path d="M290 145 L295 95 L255 130 Z" fill="none" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left eye -->
  <ellipse cx="160" cy="200" rx="22" ry="28" fill="none" stroke="#000" stroke-width="6"/>
  <circle cx="160" cy="205" r="8" fill="#000"/>
  <!-- Right eye -->
  <ellipse cx="240" cy="200" rx="22" ry="28" fill="none" stroke="#000" stroke-width="6"/>
  <circle cx="240" cy="205" r="8" fill="#000"/>
  <!-- Nose -->
  <path d="M185 245 L200 260 L215 245 Z" fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Mouth -->
  <path d="M200 260 Q170 285 150 270" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 260 Q230 285 250 270" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <!-- Whiskers left -->
  <line x1="100" y1="240" x2="170" y2="250" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="260" x2="170" y2="260" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="280" x2="170" y2="270" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- Whiskers right -->
  <line x1="300" y1="240" x2="230" y2="250" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="305" y1="260" x2="230" y2="260" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="300" y1="280" x2="230" y2="270" stroke="#000" stroke-width="4" stroke-linecap="round"/>
</svg>
