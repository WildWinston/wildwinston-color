  <!-- Legs -->
  <rect x="130" y="280" width="35" height="70" rx="8" fill="none" stroke="#000" stroke-width="6"/>
  <rect x="180" y="290" width="35" height="60" rx="8" fill="none" stroke="#000" stroke-width="6"/>
  <rect x="230" y="285" width="35" height="65" rx="8" fill="none" stroke="#000" stroke-width="6"/>
  <!-- Tail -->
  <path d="M100 220 Q60 210 50 250" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <path d="M50 250 L40 245 M50 250 L45 260" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
