  <ellipse cx="200" cy="230" rx="100" ry="80" fill="none" stroke="#000" stroke-width="7"/>
  <!-- Head -->
  <circle cx="280" cy="160" r="55" fill="none" stroke="#000" stroke-width="7"/>
