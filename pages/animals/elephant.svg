  <ellipse cx="235" cy="155" rx="25" ry="35" fill="none" stroke="#000" stroke-width="4"/>
  <!-- Trunk -->
  <path d="M320 175 Q360 200 340 260 Q330 290 350 310" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <path d="M325 180 Q355 200 340 255" fill="none" stroke="#000" stroke-width="4"/>
