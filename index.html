  <title>Color Time</title>

<body>
  <!-- HOME -->
  <div id="home">
    <header class="home-header">
      <span class="logo">🎨</span>
      <h1>Color Time</h1>
    </header>
    <nav id="categories" class="categories" aria-label="Categories"></nav>
    <div id="gallery" class="gallery"></div>
  </div>

  <!-- STUDIO -->
  <div id="studio" class="hidden">
    <div id="panelTools" class="panel panel-tools">
    <div class="panel-clip">
    <div class="top-bar">
      <button id="btnBack" class="icon-btn" aria-label="Back">🏠</button>
      <button id="btnUndo" class="icon-btn" aria-label="Undo">↩️</button>
      <button id="btnClear" class="icon-btn danger" aria-label="Clear">🗑️</button>
      <button id="btnSave" class="icon-btn" aria-label="Save">💾</button>
      <div class="tools">
        <button class="icon-btn tool-btn active" data-tool="fill" aria-label="Fill">🪣</button>
        <button class="icon-btn tool-btn" data-tool="draw" aria-label="Draw">✏️</button>
        <button class="icon-btn tool-btn" data-tool="sticker" aria-label="Stickers">⭐</button>
      </div>
    </div>
    </div>
    <button id="toggleTools" class="panel-handle" aria-controls="panelTools" aria-expanded="true" aria-label="Hide tools"><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6,15 12,9 18,15" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="canvasWrap" class="canvas-wrap">
      <canvas id="colorCanvas"></canvas>
      <canvas id="lineCanvas"></canvas>
    </div>
    <div id="panelColors" class="panel panel-colors">
    <div class="panel-clip">
    <div class="bottom-bar">
      <div class="options-row">
        <div id="brushSizes" class="brush-sizes"></div>
        <div id="stickerRow" class="sticker-row"></div>
        <div id="fillHint" class="fill-hint" aria-hidden="true">👆🪣</div>
      </div>
      <div id="palette" class="palette"></div>
    </div>
    </div>
    <button id="toggleColors" class="panel-handle" aria-controls="panelColors" aria-expanded="true" aria-label="Hide colors"><span id="colorDot" class="handle-dot"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6,15 12,9 18,15" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <!-- Clear confirm -->
  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="emoji">🗑️</div>
      <p>Clear the picture?</p>
      <div class="modal-actions">
        <button id="btnCancelClear" class="btn-cancel">No</button>
        <button id="btnConfirmClear" class="btn-ok">Yes</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
